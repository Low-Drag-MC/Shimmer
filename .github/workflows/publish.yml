name: publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "release type"
        default: release
        required: true
        type: choice
        options:
          - alpha
          - beta
          - release
      changelog:
        description: "change log"
        required: true
        type: string
      maven-repository:
        description: "maven repository"
        required: true
        type: boolean
        default: true
      github-release:
        description: "publish github release"
        type: boolean
        default: true
      modrinth:
        description: "publish modrinth"
        type: boolean
        default: true
      curseforge:
        description: "publish curseforge"
        type: boolean
        default: true
      forge:
        description: "forge"
        type: boolean
        default: true
      fabric:
        description: "fabric"
        type: boolean
        default: true


jobs:
  call-build-workflow:
    permissions:
      contents: read
    uses: "./.github/workflows/build.yml"

  upload-maven:
    needs: call-build-workflow
    runs-on: ubuntu-latest
    if: inputs.maven-repository
    env:
      MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Publish to Maven
        run: ./gradlew publish --stacktrace

  publish:
    needs: call-build-workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        loader: [ Forge, Fabric ]
        website: [ modrinth, curseforge, github_release ]
    name: ${{ matrix.website }} (${{ matrix.loader }})

    steps:
      - name: Download shimmer artifact
        uses: actions/download-artifact@v8
        with:
          name: Shimmer

      - name: Checking and setting the environment
        id: shimmer_env
        run: |
          set -euo pipefail
          libs="${{ matrix.loader }}/build/libs"
          # everything except the dev / dev-shadow / sources / javadoc jars is the release jar
          jars=$(find "$libs" -maxdepth 1 -name '*.jar' \
                   ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' \
                   ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [ "$(printf '%s\n' "$jars" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one release jar in $libs, found:"
            ls -la "$libs"
            exit 1
          fi
          name=$(basename "$jars" .jar)
          {
            echo "name=$name"
            echo "mod_name=$(echo "$name" | awk -F- '{print $1}')"
            echo "loader_name=$(echo "$name" | awk -F- '{print $2}')"
            echo "mc_version=$(echo "$name" | awk -F- '{print $3}')"
            echo "mod_version=$(echo "$name" | awk -F- '{print $4}')"
            echo "full_version=$(echo "$name" | awk -F- '{print $3"-"$4}')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Github Release
        uses: Kir-Antipov/mc-publish@v3
        if: (matrix.website == 'github_release' && inputs.github-release) && ((matrix.loader == 'Forge' && inputs.forge) || (matrix.loader == 'Fabric' && inputs.fabric))
        with:
          files: |
            ${{ matrix.loader }}/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
            ${{ matrix.loader }}/build/libs/*-@(sources|javadoc).jar
          name : ${{ steps.shimmer_env.outputs.name }}
          version : ${{ steps.shimmer_env.outputs.full_version }}
          version-type: ${{ inputs.release-type }}
          changelog: ${{ inputs.changelog }}
          java : Java 17

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true

      - name: Publish Modrinth Release
        uses: Kir-Antipov/mc-publish@v3
        if : (matrix.website == 'modrinth' && inputs.modrinth) && ((matrix.loader == 'Forge' && inputs.forge) || (matrix.loader == 'Fabric' && inputs.fabric))
        with:
          files: |
            ${{ matrix.loader }}/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
            ${{ matrix.loader }}/build/libs/*-@(sources|javadoc).jar
          name: ${{ steps.shimmer_env.outputs.name }}
          version: ${{ steps.shimmer_env.outputs.full_version }}
          version-type: ${{ inputs.release-type }}
          changelog: ${{ inputs.changelog }}
          java: Java 17

          modrinth-id: uBKACKpl
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish Curseforge Release
        uses: Kir-Antipov/mc-publish@v3
        if: (matrix.website == 'curseforge' && inputs.curseforge) && ((matrix.loader == 'Forge' && inputs.forge) || (matrix.loader == 'Fabric' && inputs.fabric))
        with:
          files: |
            ${{ matrix.loader }}/build/libs/!(*-@(dev|dev-shadow|sources|javadoc)).jar
            ${{ matrix.loader }}/build/libs/*-@(sources|javadoc).jar
          name: ${{ steps.shimmer_env.outputs.name }}
          version: ${{ steps.shimmer_env.outputs.full_version }}
          version-type: ${{ inputs.release-type }}
          changelog: ${{ inputs.changelog }}
          java: Java 17

          curseforge-id: 627824
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
